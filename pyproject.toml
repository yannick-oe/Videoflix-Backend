[tool.ruff]
line-length = 79
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["core", "auth_app", "video_app"]

[tool.coverage.run]
source = ["auth_app", "video_app", "core"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true
