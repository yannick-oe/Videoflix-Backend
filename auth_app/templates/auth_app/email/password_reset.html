<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your password</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #ffffff;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
      border="0" style="background-color: #ffffff;">
      <tr>
        <td align="center" style="padding: 32px 16px;">
          <table role="presentation" width="100%" cellpadding="0"
            cellspacing="0" border="0" style="max-width: 600px;
            font-family: 'DM Sans', Helvetica, Arial, sans-serif;
            font-size: 16px; line-height: 1.6; color: #1c2739;">
            <tr>
              <td align="center" style="padding-bottom: 32px;
                font-size: 32px; font-weight: 700; letter-spacing: 3px;
                color: #2e3edf;">
                VIDEOFLIX
              </td>
            </tr>
            <tr>
              <td style="padding-bottom: 16px;">
                Dear {{ user.email }},
              </td>
            </tr>
            <tr>
              <td style="padding-bottom: 32px;">
                We recently received a request to reset your password. To set
                a new password for your Videoflix account, please click the
                link below:
              </td>
            </tr>
            <tr>
              <td style="padding-bottom: 32px;">
                <a href="{{ reset_link }}" style="display: inline-block;
                  padding: 12px 24px; border-radius: 40px;
                  background-color: #2e3edf; color: #ffffff;
                  font-weight: 700; text-decoration: none;">
                  Reset password
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding-bottom: 32px;">
                If you did not request a password reset, please disregard
                this email.
              </td>
            </tr>
            <tr>
              <td>
                Best regards,
              </td>
            </tr>
            <tr>
              <td>
                Your Videoflix Team.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
